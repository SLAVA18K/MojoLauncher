name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Transform to GVLAUNCHER
      run: |
        # 1. Смена ID приложения (Пакет установки изменится, зависимости не сломаются)
        find . -type f -name "build.gradle" -exec sed -i 's/applicationId ".*"/applicationId "NET.GVLAUNCHER.VYACHESLAV20K"/g' {} +

        # 2. Новое имя лаунчера и титры твоей студии
        VALUES_DIR="app_pojavlauncher/src/main/res/values"
        mkdir -p $VALUES_DIR
        cat << 'EOF' > $VALUES_DIR/strings_gvlauncher.xml
        <resources>
            <string name="app_name">GVLAUNCHER</string>
            <string name="gv_credits">Обновлённый лаунчер сделала студия GAMEVANILASTUDIOS под руководством VYACHESLAV20K</string>
        </resources>
        EOF

        # 3. Принудительный синий цвет интерфейса
        cat << 'EOF' > $VALUES_DIR/colors_gvlauncher.xml
        <resources>
            <color name="colorPrimary">#0D47A1</color>
            <color name="colorPrimaryDark">#0A3578</color>
            <color name="colorAccent">#2979FF</color>
            <color name="background_material_dark">#0A0E17</color>
            <color name="primary_dark_material_dark">#0A0E17</color>
        </resources>
        EOF

        # 4. Замена ссылок на твои соцсети
        find . -type f \( -name "*.java" -o -name "*.xml" -o -name "*.json" \) -exec sed -i 's|https://t.me/[A-Za-z0-9_]*|https://t.me/GAMEVANILAPrivateServer|g' {} +
        find . -type f \( -name "*.java" -o -name "*.xml" -o -name "*.json" \) -exec sed -i 's|https://discord.gg/[A-Za-z0-9_]*|https://discord.gg/6f4SqmhWa|g' {} +

        # 5. Создание менеджера авторизации внутри оригинального пакета (чтобы не ломать импорты)
        cat << 'EOF' > app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/GVLAccountManager.java
        package net.kdt.pojavlaunch;
        import org.json.JSONObject;
        import java.io.File;
        import java.io.FileOutputStream;
        import java.util.UUID;
        public class GVLAccountManager {
            public static boolean loginCustom(String username, String filesDir, String clientType) {
                try {
                    JSONObject account = new JSONObject();
                    account.put("username", username);
                    
                    String prefix = clientType.equalsIgnoreCase("klauncher") ? "KLauncher:" : "OfflinePlayer:";
                    String uuid = UUID.nameUUIDFromBytes((prefix + username).getBytes()).toString();
                    
                    account.put("uuid", uuid);
                    account.put("accessToken", "00000000000000000000000000000000");
                    account.put("profileId", uuid.replace("-", ""));
                    account.put("userType", "legacy");
                    account.put("authProvider", clientType.toLowerCase());

                    File authDir = new File(filesDir, "auth");
                    if (!authDir.exists()) authDir.mkdirs();
                    File accountFile = new File(authDir, username + ".json");
                    FileOutputStream fos = new FileOutputStream(accountFile);
                    fos.write(account.toString().getBytes());
                    fos.close();
                    return true;
                } catch (Exception e) { return false; }
            }
        }
        EOF

        # Внедрение перехвата авторизации в LoginActivity
        TARGET_FILE=$(find app_pojavlauncher/src/main/java/ -name "LoginActivity.java" -type f | head -n 1)
        if [ -f "$TARGET_FILE" ]; then
            sed -i '/onLoginClick/a \    String name = usernameEditText.getText().toString();\n    if(name.toLowerCase().contains("kl_")) {\n        net.kdt.pojavlaunch.GVLAccountManager.loginCustom(name, getFilesDir().getAbsolutePath(), "klauncher");\n    } else {\n        net.kdt.pojavlaunch.GVLAccountManager.loginCustom(name, getFilesDir().getAbsolutePath(), "tlauncher");\n    }' "$TARGET_FILE"
        fi

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload GVLAUNCHER APK
      uses: actions/upload-artifact@v4
      with:
        name: GVLauncher-Build
        path: app_pojavlauncher/build/outputs/apk/debug/*.apk
